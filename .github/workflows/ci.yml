name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # 扩展类 e2e 依赖真实浏览器扩展加载环境，CI 上易受无头/沙箱差异影响，
      # 这里只跑不依赖扩展的离线快照探针；扩展 e2e 在本地或发行前手动执行。
      - name: E2E tests (offline snapshot probe)
        run: pnpm exec playwright test tests/e2e/dom-probe.spec.ts

      - name: Package extension zip
        run: pnpm run pack:zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: bewlybewly-extension
          path: extension.zip
          if-no-files-found: error
          overwrite: true
