name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        # 2026-11：ubuntu-latest 迁移到 Ubuntu 26 后，`--with-deps` 依赖的字体包
        # （fonts-unifont / xfonts-cyrillic / fonts-wqy-zenhei / fonts-tlwg-loma-otf 等）
        # 在新镜像的软件源里已不存在，安装会整体失败并把 job 判红。
        # 这里改为「先尝试带依赖安装，失败则退回不带依赖」：runner 镜像本身通常已具备
        # 运行 Chromium headless 所需的库，退回路径可以正常跑通。
        run: pnpm exec playwright install --with-deps chromium || pnpm exec playwright install chromium

      # 扩展类 e2e 依赖真实浏览器扩展加载环境，CI 上易受无头/沙箱差异影响，
      # 这里只跑不依赖扩展的离线快照探针；扩展 e2e 在本地或发行前手动执行。
      - name: E2E tests (offline snapshot probe)
        run: pnpm exec playwright test tests/e2e/dom-probe.spec.ts

      - name: Package extension zip
        run: pnpm run pack:zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: bewlybewly-extension
          path: extension.zip
          if-no-files-found: error
          overwrite: true
