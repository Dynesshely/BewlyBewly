name: Bilibili DOM Probe

# 每天定时探测 B 站线上 DOM 结构，尽早发现上游改版导致的选择器失效。
on:
  schedule:
    # 每天 UTC 01:00（北京时间 09:00）
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: |
            - args: [--frozen-lockfile]

      - name: Install Playwright Chromium
        # 2026-11：ubuntu-latest 迁移到 Ubuntu 26 后，`--with-deps` 依赖的字体包
        # （fonts-unifont / xfonts-cyrillic / fonts-wqy-zenhei / fonts-tlwg-loma-otf 等）
        # 在新镜像的软件源里已不存在，安装会整体失败并把 job 判红。
        # 这里改为「先尝试带依赖安装，失败则退回不带依赖」：runner 镜像本身通常已具备
        # 运行 Chromium headless 所需的库，退回路径可以正常跑通。
        run: pnpm exec playwright install --with-deps chromium || pnpm exec playwright install chromium

      - name: Run online DOM probe
        run: pnpm run test:e2e:online
